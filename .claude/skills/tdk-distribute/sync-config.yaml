# Default include/exclude rules for tdk-distribute.
# Paths are relative to the .specify/ directory.

include:
  - _shared
  - plugin-marketplaces/
  - scripts/
  - templates/
  - setup.sh
  - CHANGELOG.md
  - .specify.env.example
  - .specify.yaml.example
  - .specify.json.example

exclude:
  # Never sync project-specific config or secrets
  - configurations/
  - memory/
  - .specify.yaml
  - .specify.env
  # Never sync dependency artifacts or build caches
  - scripts/ts/node_modules/
  - __pycache__/
